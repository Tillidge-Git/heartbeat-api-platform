name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'terraform/platform/**'

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      has_platform_changes: ${{ steps.filter.outputs.platform }}
      has_bootstrap_changes: ${{ steps.filter.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            platform:
              - 'terraform/platform/**'
            bootstrap:
              - 'terraform/bootstrap/**'
  plan-bootstrap:
    needs: changes
    if: needs.changes.outputs.has_bootstrap_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: terraform fmt
        working-directory: terraform/bootstrap
        run: terraform fmt -check
      - name: Terraform Init
        working-directory: terraform/bootstrap
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform/bootstrap
        run: terraform validate
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/bootstrap
      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLAN_AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Terraform init
        working-directory: terraform/bootstrap
        run: terraform init -input=false
      - name: Terraform Plan
        working-directory: terraform/bootstrap
        run: terraform plan

  plan-platform:
    needs: changes
    if: needs.changes.outputs.has_platform_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: terraform fmt
        working-directory: terraform/platform
        run: terraform fmt -check
      - name: Terraform Init
        working-directory: terraform/platform
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: terraform/platform
        run: terraform validate
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/platform
      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLAN_AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Terraform init
        working-directory: terraform/platform
        run: terraform init -input=false
      - name: Terraform Plan
        working-directory: terraform/platform
        run: terraform plan

  plan-merge-platform:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.has_platform_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLAN_AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Terraform init
        working-directory: terraform/platform
        run: terraform init -input=false
      - name: Terraform Plan  
        working-directory: terraform/platform
        run: terraform plan -out=tfplan -input=false
      - name: Terraform Show
        working-directory: terraform/platform
        run: terraform show -no-color tfplan 
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/platform/tfplan
          retention-days: 1




  apply-platform:
    needs: [changes, plan-merge-platform]
    if: github.event_name == 'push' && needs.changes.outputs.has_platform_changes == 'true'
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/platform
      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APPLY_AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Terraform init
        working-directory: terraform/platform
        run: terraform init -input=false
      - name: Terraform Apply
        working-directory: terraform/platform
        run: terraform apply -input=false tfplan
        